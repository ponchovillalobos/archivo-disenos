body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.6 var(--ui);
  -webkit-font-smoothing:antialiased}
.w{max-width:1240px;margin:0 auto;padding:0 26px}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--sangre);outline-offset:3px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

header{padding:66px 0 30px}
.eyebrow{margin:0;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:700;color:var(--sangre)}
h1{font-family:var(--display);font-weight:700;margin:12px 0 0;
  font-size:clamp(52px,9.5vw,112px);line-height:.86;letter-spacing:-.042em}
.lema{margin:20px 0 0;font-family:var(--display);font-style:italic;font-size:clamp(17px,2vw,22px);
  color:var(--media);max-width:44ch}
.regla{height:1px;background:var(--filete);margin-top:34px;position:relative}
.regla::after{content:"";position:absolute;left:0;top:0;width:72px;height:3px;
  background:var(--sangre)}

/* ---- controles ---- */
.ctrl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:24px 0 6px;
  position:sticky;top:0;background:var(--papel);z-index:20}
.buscar{flex:1 1 240px;max-width:340px;position:relative}
.buscar input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--filete);
  border-radius:6px;background:var(--tarjeta);color:var(--tinta);font-size:14.5px}
.buscar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--leve)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:6px 12px;border:1px solid var(--filete);border-radius:999px;
  color:var(--media);background:var(--tarjeta);transition:.13s}
.chip:hover{border-color:var(--leve)}
.chip[aria-pressed="true"]{background:var(--sangre);border-color:var(--sangre);color:#fff}
.cuenta{margin-left:auto;font-size:12.5px;color:var(--leve);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- colecciones ---- */
.cols{display:flex;flex-direction:column;gap:52px;padding:26px 0 0}
.grupo{display:flex;flex-direction:column;gap:16px}
.gt{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:11px;border-bottom:1px solid var(--filete)}
.gt h2{font-family:var(--display);margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em}
.gsub{font-size:13.5px;color:var(--leve);flex:1}
.gn{font-size:12px;font-weight:700;color:var(--sangre);letter-spacing:.08em;
  font-variant-numeric:tabular-nums}
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.col{background:var(--tarjeta);border:1px solid var(--filete);border-radius:5px;
  overflow:hidden;display:flex;flex-direction:column}
/* Una imagen principal, no una tira de cuatro: recortar las láminas en
   columnas estrechas partía las palabras del titular. */
.tira{position:relative;background:var(--filete);overflow:hidden}
.tira button{padding:0;display:block;width:100%;overflow:hidden}
/* altura fija en píxeles: con aspect-ratio la imagen se desbordaba */
.tira img{width:100%;height:300px;object-fit:cover;object-position:center 16%;
  transition:transform .45s cubic-bezier(.2,.6,.2,1)}
.tira button:hover img{transform:scale(1.03)}
.mas{position:absolute;right:12px;bottom:12px;background:rgba(12,8,9,.72);
  color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.06em;
  padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px);pointer-events:none}
.cx{padding:16px 18px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
.col h2{font-family:var(--display);margin:0;font-size:21px;font-weight:700;
  letter-spacing:-.015em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.et{font:700 9.5px/1 var(--ui);letter-spacing:.11em;text-transform:uppercase;
  padding:4px 7px;border-radius:2px;border:1px solid var(--filete);color:var(--leve)}
.et.publicado{background:var(--sangre);color:#fff;border-color:var(--sangre)}
.meta{margin:0;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--leve)}
.res{margin:0;font-size:14px;color:var(--media);line-height:1.55}
.nota{margin:2px 0 0;font-size:12.5px;color:var(--leve);line-height:1.5;
  padding-left:11px;border-left:2px solid var(--filete)}
.bajar{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.db{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  text-decoration:none;color:var(--sangre);border:1px solid var(--sangre);
  border-radius:5px;padding:7px 13px;transition:background .13s,color .13s}
.db:hover{background:var(--sangre);color:#fff}
.db.play{background:var(--sangre);color:#fff}
.db.play:hover{filter:brightness(1.12)}
.db.carp{color:var(--media);border-color:var(--filete);font-weight:500}
.db.carp:hover{background:var(--hueso);color:var(--tinta);border-color:var(--leve)}

.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:9px}
.tag{font-size:11px;color:var(--leve);background:var(--hueso);padding:3px 8px;border-radius:3px}
.vacio{padding:60px 0;text-align:center;color:var(--leve)}

/* ---- visor ---- */
.visor{position:fixed;inset:0;background:var(--fondo-visor);z-index:80;display:none;
  place-items:center;padding:26px;backdrop-filter:blur(6px)}
.visor.on{display:grid}
.visor figure{margin:0;max-height:100%;display:flex;flex-direction:column;gap:12px;
  align-items:center}
.visor img,.visor video{max-height:80vh;width:auto;border-radius:4px;
  box-shadow:0 24px 70px rgba(0,0,0,.5);background:#000}
.visor video{max-width:min(92vw,460px)}
.visor figcaption{color:#f4efee;font-size:14px;text-align:center;max-width:60ch}
.visor figcaption b{display:block;font-family:var(--display);font-size:19px;margin-bottom:3px}
.vbtn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;
  border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:20px;
  display:grid;place-items:center}
.vbtn:hover{background:rgba(255,255,255,.2)}
.vprev{left:18px} .vnext{right:18px}
.vcerrar{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;font-size:19px;display:grid;place-items:center}
.vcerrar:hover{background:rgba(255,255,255,.2)}
.vsin{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:999px;backdrop-filter:blur(8px)}
.vsin:hover{background:rgba(255,255,255,.24)}
.db.q{color:var(--media);border-color:var(--filete);font-weight:500}
.db.q:hover{background:var(--sangre);color:#fff;border-color:var(--sangre)}

footer{margin-top:70px;padding:26px 0 64px;border-top:1px solid var(--filete);
  font-size:13px;color:var(--leve);line-height:1.8}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--hueso);
  border-radius:3px;padding:2px 6px}
@media (max-width:620px){.w{padding:0 17px}header{padding:44px 0 22px}
  .ctrl{position:static}.cuenta{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* sistema tipográfico */
body{font-family:var(--ui);font-variation-settings:"CASL" .28,"MONO" 0}
h1{font-family:var(--display);font-variation-settings:"opsz" 144,"WONK" 1,"SOFT" 0}
.lema{font-family:var(--texto);font-variation-settings:"opsz" 24}
.gt h2{font-family:var(--display);font-variation-settings:"opsz" 96,"WONK" 1}
.col h2{font-family:var(--display);font-variation-settings:"opsz" 60,"WONK" 1}
.res{font-family:var(--texto);font-variation-settings:"opsz" 18}
.nota{font-family:var(--texto);font-variation-settings:"opsz" 14}
.eyebrow,.meta,.et,.gn,.mas{font-variation-settings:"CASL" .1,"MONO" 0}
.db,.chip,.cuenta,.buscar input{font-variation-settings:"CASL" .3,"MONO" 0}
code,.ru code{font-family:var(--mono);font-variation-settings:"MONO" 1,"CASL" .2}
.visor figcaption b{font-family:var(--display);font-variation-settings:"opsz" 48,"WONK" 1}
.gsub{font-family:var(--texto);font-variation-settings:"opsz" 16}
.vermas{display:block;width:100%;margin-top:16px;padding:13px;
  border:1px dashed var(--filete);background:none;border-radius:3px;
  cursor:pointer;font-family:Recursive,monospace;font-size:12.5px;
  letter-spacing:.06em;color:var(--media)}
.vermas:hover{border-color:var(--media);color:var(--tinta)}
</style>

<script>
const $ = s => document.querySelector(s);
let DATOS = {proyectos: []}, activos = new Set(), consulta = "";
let vProj = null, vIdx = 0, vSin = false;

const src = (z, a) => "img/" + (z.src[String(a)] || (a >= 1024 ? z.src.max : null)
                                || z.src["400"] || z.src.max);
const lista = p => vSin && p.sin_texto.length ? p.sin_texto : p.piezas;

function texto(p) {
  return [p.titulo, p.serie, p.resumen, p.nota, p.etiquetas.join(" ")]
         .join(" ").toLowerCase();
}
function visibles() {
  return DATOS.proyectos.filter(p =>
    (!activos.size || p.etiquetas.some(e => activos.has(e))) &&
    (!consulta || texto(p).includes(consulta)));
}

function ficha(p) {
  const p0 = p.piezas[0];
  const bot = [];
  // una ficha puede traer varios formatos del mismo vídeo (vertical y apaisado)
  const vids = p.videos && p.videos.length ? p.videos
             : (p.video ? [{etq:"Ver vídeo", url:p.video}] : []);
  vids.forEach(v => bot.push(`<button class="db play" data-v="${v.url}" data-t="${p.titulo}">▶ ${v.etq}</button>`));
  p.descargas.forEach(d => bot.push(`<a class="db q" href="${d.url}" download>↓ ${d.etq}</a>`));
  bot.push(`<button class="db carp" data-ruta="${p.rutaAbs}">Abrir en Finder</button>`);
  return `
  <article class="col">
    <div class="tira">
      <button data-p="${p.id}" data-i="0" aria-label="Ver ${p.titulo}">
        <img src="${src(p0,1024)}" alt="${p.titulo}" loading="lazy" decoding="async">
      </button>
      <span class="mas">${p.piezas.length} + ${p.sin_texto.length}</span>
    </div>
    <div class="cx">
      <h2>${p.titulo}</h2>
      <p class="meta">${p.formato} · ${p.descargas.length} descargas</p>
      <p class="res">${p.resumen}</p>
      <p class="nota">${p.nota}</p>
      <div class="bajar">${bot.join("")}</div>
      <div class="tags">${p.etiquetas.map(e => `<span class="tag">${e}</span>`).join("")}</div>
    </div>
  </article>`;
}

const ABIERTAS = new Set(["El camino del espartano"]);

function pintar() {
  const v = visibles();
  const series = [...new Set(DATOS.proyectos.map(p => p.serie))];
  $("#cols").innerHTML = series.map(se => {
    const d = v.filter(p => p.serie === se);
    if (!d.length) return "";
    /* Con 45 fichas la página ya era un muro; con 68 sería inservible. Cada
       sección enseña seis y guarda el resto tras un botón: todo sigue
       accesible y la primera pantalla vuelve a ser legible. Con búsqueda
       activa se despliega sola, porque ahí ya has filtrado tú.
       OJO con el nombre de la clase: `.mas` ya es la insignia «6 + 6» de cada
       ficha. Usar ese nombre habría roto el diseño en silencio. */
    const TOPE = 6;
    const buscando = (($("#q") && $("#q").value) || "").trim().length > 0;
    const abierta = ABIERTAS.has(se) || buscando;
    const vis = abierta ? d : d.slice(0, TOPE);
    const resto = d.length - vis.length;
    const plegable = !buscando && d.length > TOPE;
    return `<section class="grupo">
      <div class="gt"><h2>${se}</h2>
        <span class="gsub">vídeo, PDF, láminas y fondos en cada ficha</span>
        <span class="gn">${d.length}</span></div>
      <div class="rej">${vis.map(ficha).join("")}</div>
      ${plegable ? `<button class="vermas" data-se="${se}">${
          resto > 0 ? `Ver ${resto} más de «${se}»  ↓` : `Plegar «${se}»  ↑`
        }</button>` : ""}
      </section>`;
  }).join("");
  document.querySelectorAll(".vermas").forEach(b => b.onclick = () => {
    const se = b.dataset.se;
    ABIERTAS.has(se) ? ABIERTAS.delete(se) : ABIERTAS.add(se);
    pintar();
  });
  $("#vacio").hidden = v.length > 0;
  $("#cuenta").textContent = `${v.length} proyectos · ${v.reduce((s,p)=>s+p.piezas.length+p.sin_texto.length,0)} imágenes`;

  document.querySelectorAll(".tira button").forEach(b =>
    b.addEventListener("click", () => abrir(b.dataset.p, +b.dataset.i)));
  document.querySelectorAll(".play").forEach(b =>
    b.addEventListener("click", () => verVideo(b.dataset.v, b.dataset.t)));
  document.querySelectorAll(".carp").forEach(b =>
    b.addEventListener("click", async () => {
      const a = b.textContent;
      const di = t => { b.textContent = t; setTimeout(()=>b.textContent=a, 2600); };
      if (location.protocol === "http:") {
        try { const r = await fetch("/abrir?ruta="+encodeURIComponent(b.dataset.ruta));
              return di(r.ok ? "Abierta en Finder" : "No se pudo"); } catch(e) {}
      }
      try { await navigator.clipboard.writeText(b.dataset.ruta); di("Ruta copiada · ⌘⇧G"); }
      catch(e) { di(b.dataset.ruta); }
    }));
}

function pintarChips() {
  const c = {};
  DATOS.proyectos.forEach(p => p.etiquetas.forEach(e => c[e] = (c[e]||0)+1));
  $("#chips").innerHTML = Object.keys(c)
    .sort((a,b)=>c[b]-c[a]||a.localeCompare(b)).slice(0,10)
    .map(e => `<button class="chip" data-tag="${e}" aria-pressed="false">${e}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => {
      const t = b.dataset.tag;
      activos.has(t) ? activos.delete(t) : activos.add(t);
      b.setAttribute("aria-pressed", activos.has(t)); pintar();
    }));
}

function verVideo(url, tit) {
  vProj = null;
  $("#vimg").hidden = true; $("#vsin").hidden = true;
  const v = $("#vvideo"); v.hidden = false;
  v.src = url + (location.protocol === "http:" ? "?ver" : "");
  $("#vpie").innerHTML = `<b>${tit}</b>Vídeo · Esc para cerrar`;
  $("#vprev").hidden = $("#vnext").hidden = true;
  $("#visor").classList.add("on"); v.play().catch(()=>{});
}

function abrir(id, i) {
  const v = $("#vvideo"); v.pause(); v.hidden = true; v.removeAttribute("src");
  $("#vimg").hidden = false; $("#vprev").hidden = $("#vnext").hidden = false;
  vProj = DATOS.proyectos.find(p => p.id === id); vIdx = i; vSin = false;
  $("#vsin").hidden = !vProj.sin_texto.length;
  mostrar(); $("#visor").classList.add("on"); $("#vcerrar").focus();
}
function mostrar() {
  const L = lista(vProj), z = L[Math.min(vIdx, L.length-1)];
  $("#vimg").src = src(z, 1600); $("#vimg").alt = vProj.titulo;
  $("#vsin").textContent = vSin ? "Ver con texto" : "Ver sin texto";
  $("#vpie").innerHTML = `<b>${vProj.titulo}</b>${vSin?"Fondo sin texto":"Lámina"} `
    + `${vIdx+1} de ${L.length} · ${z.w}×${z.h}`;
}
function mover(d) { if (!vProj) return;
  const n = lista(vProj).length; vIdx = (vIdx+d+n)%n; mostrar(); }
function cerrar() {
  const v = $("#vvideo"); v.pause(); v.hidden = true; v.removeAttribute("src");
  $("#vimg").hidden = false; $("#visor").classList.remove("on");
}

$("#vcerrar").addEventListener("click", cerrar);
$("#vprev").addEventListener("click", () => mover(-1));
$("#vnext").addEventListener("click", () => mover(1));
$("#vsin").addEventListener("click", () => { vSin = !vSin; vIdx = 0; mostrar(); });
$("#visor").addEventListener("click", e => { if (e.target.id === "visor") cerrar(); });
document.addEventListener("keydown", e => {
  if (!$("#visor").classList.contains("on")) return;
  if (e.key === "Escape") cerrar();
  if (e.key === "ArrowLeft") mover(-1);
  if (e.key === "ArrowRight") mover(1);
});
$("#q").addEventListener("input", e => { consulta = e.target.value.trim().toLowerCase(); pintar(); });

function arrancar(d) {
  DATOS = d; pintarChips(); pintar();
  const n = d.proyectos.reduce((s,p)=>s+p.piezas.length+p.sin_texto.length,0);
  $("#pie-stats").textContent = `${d.proyectos.length} proyectos · ${n} imágenes · última actualización ${d.generado}`;
}
let _d = null;
try { _d = JSON.parse($("#datos").textContent); } catch(e) {}
if (_d && _d.proyectos && _d.proyectos.length) arrancar(_d);
else fetch("datos.json").then(r=>r.json()).then(arrancar)
     .catch(()=>{ $("#cols").innerHTML = '<p class="vacio">Catálogo vacío.</p>'; });
</script>
<script>
/* La página se recarga sola cuando el catálogo cambia.
   Nace de un fallo repetido: el portal se reconstruía y en pantalla seguía lo
   viejo, y hacía falta acordarse de recargar forzando. Un portal que crece
   mientras produces no puede depender de que alguien pulse una tecla.
   Pregunta por un sello de 12 caracteres, no por la página entera. */
(function () {
  const mio = (DATOS && DATOS.sello) || null;
  if (!mio) return;
  let fallos = 0;
  setInterval(async () => {
    try {
      const r = await fetch("sello.json?t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      fallos = 0;
      if (j.sello && j.sello !== mio) location.reload();
    } catch (e) {
      /* sin servidor (abierto como archivo) no hay nada que vigilar */
      if (++fallos > 3) clearInterval(this);
    }
  }, 6000);
})();
</script>
</body>
</html>
